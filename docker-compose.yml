services:
  qwen-vlm:
    build: ./qwen-server
    container_name: qwen-vlm
    restart: unless-stopped
    ports:
      - 8000:8000
    env_file:
      - ./qwen-server/.env
    volumes:
      - ./qwen-server/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - app-net

  dbhub:
    image: bytebase/dbhub:latest
    container_name: dbhub
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --config
      - /workspace/dbhub.toml
    ports:
      - "8080:8080"
    volumes:
      - ./mcps/db-server/dbhub.toml:/workspace/dbhub.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app-net

  markitdown-mcp:
    build:
      context: ./mcps/markitdown-mcp
      dockerfile: Dockerfile
    container_name: markitdown-mcp
    command: ["--http", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./:/workdir:ro
    restart: unless-stopped
    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped
    networks:
      - qdrant-net

  qdrant-mcp:
    build:
      context: ./mcps/mcp-server-qdrant
      dockerfile: Dockerfile
    container_name: qdrant-mcp
    command:
      [
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: "http://qdrant:6333"
      COLLECTION_NAME: "project-memory"
      EMBEDDING_PROVIDER: "fastembed"
      EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      FASTEMBED_CACHE_PATH: "/opt/fastembed-cache"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
    ports:
      - "127.0.0.1:3002:8000"
    restart: unless-stopped
    networks:
      - qdrant-net

  gitlab-mcp:
    profiles: ["integrations"]
    build:
      context: ./mcps/gitlab-mcp
      dockerfile: Dockerfile
    container_name: gitlab-mcp
    env_file:
      - ./.env.gitlab
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      STREAMABLE_HTTP: "true"
      STREAMABLE_HTTP_AUTH_TOKEN: "${GITLAB_MCP_AUTH_TOKEN:-}"
      GITLAB_PERMISSION_MODE: "readonly"
      GITLAB_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:3003:3002"
    restart: unless-stopped
    networks:
      - integrations-net

  jira-mcp:
    profiles: ["integrations"]
    build:
      context: ./mcps/jira-mcp
      dockerfile: Dockerfile
    container_name: jira-mcp
    env_file:
      - ./.env.jira
    command:
      [
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--read-only",
      ]
    ports:
      - "127.0.0.1:3004:9000"
    restart: unless-stopped
    networks:
      - integrations-net

networks:
  app-net:
    driver: bridge
  qdrant-net:
    driver: bridge
  integrations-net:
    driver: bridge

volumes:
  qdrant-storage:

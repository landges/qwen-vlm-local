services:
  qwen-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.19.0}
    container_name: qwen-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODEL_DIR:-./models/Qwen3.5-35B-A3B-GPTQ-Int4}:/models/Qwen3.5-35B-A3B-GPTQ-Int4:ro
    command:
      - --model
      - /models/Qwen3.5-35B-A3B-GPTQ-Int4
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3.5-35b-a3b}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${API_KEY:-change-me}
      - --max-model-len
      - ${MAX_MODEL_LEN:-147456}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.94}
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - ${MAX_NUM_BATCHED_TOKENS:-4096}
      - --max-num-seqs
      - ${MAX_NUM_SEQS:-2}
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --reasoning-parser
      - qwen3
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - llm-net

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-net

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: litellm-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-net

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.101.2}
    container_name: litellm
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-change-me-salt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-change-me-db}@postgres:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-qwen3.5-35b-a3b}
      VLLM_MODEL: openai/${SERVED_MODEL_NAME:-qwen3.5-35b-a3b}
      VLLM_API_BASE: http://qwen-vllm:8000/v1
      VLLM_API_KEY: ${API_KEY:-change-me}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      qwen-vllm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - llm-net

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.4}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-too}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge

volumes:
  open-webui-data:
  postgres-data:
  redis-data:

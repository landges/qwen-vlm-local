<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Memory MCP{% endblock %}</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #202124; }
    nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; }
    nav .spacer { flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .7rem; border-bottom: 1px solid #ddd; }
    input, select, button { font: inherit; padding: .55rem; }
    button, .button { background: #275efe; color: white; border: 0; border-radius: 5px; text-decoration: none; padding: .6rem .9rem; cursor: pointer; }
    .danger { background: #b42318; }
    .token { overflow-wrap: anywhere; padding: 1rem; background: #f4f5f7; border: 1px solid #ccc; }
    .muted { color: #666; }
    .errorlist { color: #b42318; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard' %}">Memory MCP</a>
    {% if user.is_staff %}<a href="/admin/">Администрирование</a>{% endif %}
    <span class="spacer"></span><span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
